name: Laporan bug
description: Laporkan sesuatu yang tidak berjalan semestinya
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
      description: Jelaskan bug-nya dan apa yang seharusnya terjadi.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka halaman ...
        2. Klik ...
        3. Muncul ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Bagian aplikasi
      options:
        - Simpan link (form, bookmarklet, share target, import)
        - Cari & atur (tag, koleksi, Terlupakan)
        - Berbagi (link, koleksi, Dibagikan ke saya, link publik)
        - Login magic link
        - Deploy / setup
        - Lainnya
  - type: dropdown
    id: layout
    attributes:
      label: Tampilan
      options:
        - Desktop
        - Tablet
        - HP
  - type: input
    id: env
    attributes:
      label: Browser / perangkat
      placeholder: Chrome 130, Android
  - type: textarea
    id: extra
    attributes:
      label: Screenshot atau log
